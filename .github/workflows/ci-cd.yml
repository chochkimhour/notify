name: CI and reminders

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      alert:
        description: Reminder to send now
        type: choice
        options: [morning-in, morning-out, afternoon-in, afternoon-out]

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm run check
      - run: npm test

  reminder:
    if: github.event_name == 'workflow_dispatch'
    name: Send attendance reminder
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel alert endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
          ALERT: ${{ inputs.alert }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$APP_URL/api/send-alert" \
            -H "Authorization: Bearer $ALERT_SECRET" \
            -H 'Content-Type: application/json' \
            -d "{\"alert\":\"$ALERT\"}"
