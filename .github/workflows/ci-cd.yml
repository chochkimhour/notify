name: CI and reminders

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * 1-5'
    - cron: '0 5 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '30 10 * * 1-5'

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule'
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm test

  reminder:
    if: github.event_name == 'schedule'
    name: Send scheduled attendance reminder
    runs-on: ubuntu-latest
    steps:
      - name: Map schedule to alert
        id: alert
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            '0 1 * * 1-5') echo 'name=morning-in' >> "$GITHUB_OUTPUT" ;;
            '0 5 * * 1-5') echo 'name=morning-out' >> "$GITHUB_OUTPUT" ;;
            '30 6 * * 1-5') echo 'name=afternoon-in' >> "$GITHUB_OUTPUT" ;;
            '30 10 * * 1-5') echo 'name=afternoon-out' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown schedule: $SCHEDULE" >&2; exit 1 ;;
          esac
      - name: Call Vercel alert endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
          ALERT: ${{ steps.alert.outputs.name }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$APP_URL/api/send-alert" \
            -H "Authorization: Bearer $ALERT_SECRET" \
            -H 'Content-Type: application/json' \
            -d "{\"alert\":\"$ALERT\"}"
